<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>XOX Pop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10142A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XOX Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* One column: score and chase bar, Classic/Daily tabs, a 7x7 board of candy blocks, a tray of three pieces. */
:root {
  --paper: #EEF1F7;
  --board: #D5DCEA;
  --tile: #E3E8F2;
  --ink: #161C38;
  --ink2: #5A6386;
  --card: #FFFFFF;
  --x: #3566FF;
  --o: #F23F8C;
  --gold: #FFC400;
  --fire: #FF7A00;
  --shadow: 0 10px 30px rgba(22, 28, 56, .16);
  /* board cell size: fits the width, and the height with everything around it */
  --gap: 5px;
  --cell: min(calc((100vw - 32px - 4 * var(--gap) - 16px) / 5), calc((100svh - 350px) / 7.6), 64px);
  --f: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10142A; --board: #1A2046; --tile: #232A55; --ink: #EEF0FF; --ink2: #9CA6D2; --card: #1C2248;
    --x: #5C86FF; --o: #FF5C9F; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10142A; --board: #1A2046; --tile: #232A55; --ink: #EEF0FF; --ink2: #9CA6D2; --card: #1C2248;
  --x: #5C86FF; --o: #FF5C9F; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f);
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }

.shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 18px max(16px, env(safe-area-inset-right, 0px));
}

/* top bar */
.top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.best { font-size: 12px; font-weight: 800; color: var(--ink2); letter-spacing: .05em; }
.best b { display: block; font-size: 18px; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.score { font-size: 46px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-align: center; }
.score.bump { animation: bump .3s ease-out; }
.tools { display: flex; gap: 4px; justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--tile); }
.icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.armed { color: var(--o); background: var(--tile); }

/* chase bar: your score against the best you are trying to beat */
.chase { width: 100%; height: 6px; border-radius: 99px; background: var(--tile); overflow: hidden; }
.chase i { display: block; height: 100%; border-radius: 99px; background: var(--x); transform-origin: left; transform: scaleX(0); transition: transform .45s ease-out, background .3s; }
.chase.won i { background: var(--gold); }
.chase.off { visibility: hidden; }

/* Classic / Daily */
.modes { display: flex; gap: 4px; padding: 4px; background: var(--tile); border-radius: 14px; }
.modes button { min-height: 34px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.modes button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(22, 28, 56, .14); }
.streak-chip { display: inline-flex; align-items: center; gap: 1px; color: var(--fire); font-weight: 900; }
.streak-chip.cold { opacity: .45; }
.streak-chip.none { display: none; }
.flame { width: 16px; height: 16px; fill: currentColor; flex: none; }

.status { min-height: 20px; font-size: 13px; font-weight: 800; color: var(--ink2); letter-spacing: .02em; text-align: center; }
.status .hot { color: var(--fire); }

/* board */
.board-wrap { position: relative; }
.board {
  display: grid; grid-template-columns: repeat(var(--n), var(--cell)); gap: var(--gap); padding: 8px;
  background: var(--board); border-radius: 20px; touch-action: none;
  box-shadow: inset 0 2px 6px rgba(22, 28, 56, .12);
}
.board.shake { animation: shake .35s ease-out; }
.board.quake { animation: quake .5s ease-out; }
.board.will-wipe { outline: 4px solid var(--gold); outline-offset: 3px; animation: wipeglow .4s ease-in-out infinite alternate; }
.cell { --u: var(--cell); width: var(--cell); height: var(--cell); border-radius: 22%; background: var(--tile); position: relative; display: grid; place-items: center; box-shadow: inset 0 3px 0 rgba(22, 28, 56, .05); }

/* candy blocks: glossy gradient, darker bottom edge, white mark */
.blk {
  --c-hi: #6E9BFF; --c: #3566FF; --c-lo: #2A50E2; --c-dk: #1C37B4;
  position: relative; display: grid; place-items: center; border-radius: 22%;
  background: linear-gradient(165deg, var(--c-hi), var(--c) 55%, var(--c-lo));
  box-shadow: inset 0 calc(var(--u) * -.09) 0 var(--c-dk), inset 0 calc(var(--u) * .04) 0 rgba(255, 255, 255, .4), 0 calc(var(--u) * .05) calc(var(--u) * .1) rgba(22, 28, 56, .28);
}
.blk.o { --c-hi: #FF84BE; --c: #F23F8C; --c-lo: #DE2B78; --c-dk: #A3155A; }
.blk::before {
  content: ''; position: absolute; left: 14%; right: 14%; top: 8%; height: 30%; border-radius: 99px;
  background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, 0));
}
.mk { position: relative; width: 58%; height: 58%; margin-top: -6%; fill: none; stroke: #fff; stroke-width: 6.5; stroke-linecap: round; overflow: visible; filter: drop-shadow(0 1.5px 0 rgba(0, 0, 0, .2)); }
.cell.ghost { opacity: .5; }
.cell.will-pop { outline: 4px solid var(--gold); outline-offset: 1px; animation: glow .45s ease-in-out infinite alternate; }
.cell.will-blast { outline: 4px solid var(--fire); outline-offset: 1px; animation: glow .3s ease-in-out infinite alternate; }
.cell.land { animation: land .22s ease-out; }
.cell.pop, .cell.blast { animation: pop .36s ease-in var(--d, 0ms) both; }

/* tray */
.tray { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: calc(var(--cell) * 2.6 + 16px); touch-action: none; }
.slot { display: grid; place-items: center; border-radius: 18px; position: relative; }
.slot.selected { background: var(--tile); }
.piece { --pc: calc(var(--cell) * .62); display: grid; gap: 4px; transition: opacity .2s, transform .15s; }
.piece .blk { --u: var(--pc); width: var(--pc); height: var(--pc); }
.slot.nofit .piece { opacity: .3; filter: grayscale(.6); }
.slot.dragging .piece { opacity: 0; }
.slot.fresh .piece { animation: deal .3s ease-out backwards; }
.slot:nth-child(2).fresh .piece { animation-delay: .05s; }
.slot:nth-child(3).fresh .piece { animation-delay: .1s; }

/* the piece under your finger, at full board size */
.float { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: grid; gap: var(--gap); filter: drop-shadow(0 12px 14px rgba(22, 28, 56, .25)); }
.float .blk { --u: var(--cell); width: var(--cell); height: var(--cell); }
.float.back { transition: transform .18s ease-in, opacity .18s; opacity: 0; }

/* effects layer */
.fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.spark { position: absolute; width: 9px; height: 9px; border-radius: 50%; margin: -4.5px 0 0 -4.5px; animation: spark .6s ease-out forwards; }
.gain { position: absolute; transform: translate(-50%, -50%); font-size: 26px; font-weight: 900; color: var(--ink); text-shadow: 0 2px 0 var(--paper); animation: rise .9s ease-out forwards; white-space: nowrap; }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: banner .95s ease-out forwards; white-space: nowrap; }
.banner.big { font-size: 50px; color: #fff; -webkit-text-stroke: 3px var(--fire); animation-duration: 1.25s; }
.banner.small { top: 66%; font-size: 22px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); }
.banner.best { top: 30%; font-size: 40px; color: var(--gold); animation-duration: 1.25s; }
.flash { position: absolute; inset: 0; border-radius: 20px; background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, .7) 45%, rgba(255, 255, 255, 0) 75%); animation: flash .7s ease-out forwards; }

/* game over */
.over { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(16, 20, 42, .45); animation: fade .25s ease-out; }
.over-card { width: min(100%, 340px); background: var(--card); border-radius: 26px; padding: 26px 22px 20px; text-align: center; box-shadow: var(--shadow); animation: deal .3s ease-out; }
.over-card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: var(--ink2); }
.over-card .big { font-size: 58px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
.over-card .newbest { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 99px; background: var(--gold); color: #161C38; font-weight: 900; font-size: 14px; letter-spacing: .04em; }
.over-card p { margin: 8px 0 0; color: var(--ink2); font-weight: 700; }
.over-card .close b { color: var(--o); }
.over-card .extras { font-size: 14px; }
.week { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--ink2); }
.day i { width: 24px; height: 24px; border-radius: 50%; background: var(--tile); }
.day.on i { background: linear-gradient(160deg, #FFC400, var(--fire)); }
.day.now i { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink2); }
.streak-line { color: var(--fire) !important; }
.streak-line .flame { vertical-align: -3px; margin-right: 2px; }
.play { margin-top: 18px; width: 100%; height: 56px; border-radius: 18px; background: var(--x); color: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 5px 0 rgba(0, 0, 0, .2); }
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
.alt { margin-top: 10px; width: 100%; height: 46px; border-radius: 16px; background: var(--tile); color: var(--ink); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }
.alt .flame { color: var(--fire); }

/* first run hint */
.hint { font-size: 14px; font-weight: 700; color: var(--ink2); text-align: center; max-width: 320px; line-height: 1.35; margin: 0; }
.hint .x { color: var(--x); } .hint .o { color: var(--o); }

@media (max-height: 640px) { .shell { gap: 8px; } .score { font-size: 38px; } .hint { font-size: 12px; } }

@keyframes bump { 50% { transform: scale(1.14); } }
@keyframes land { from { transform: scale(1.25); } to { transform: scale(1); } }
@keyframes pop { 0% { transform: scale(1); filter: brightness(1); } 35% { transform: scale(1.2); filter: brightness(1.8); } 100% { transform: scale(0) rotate(25deg); opacity: 0; } }
@keyframes glow { to { filter: brightness(1.35); transform: scale(.94); } }
@keyframes wipeglow { from { box-shadow: inset 0 2px 6px rgba(22, 28, 56, .12), 0 0 0 0 var(--gold); } to { box-shadow: inset 0 2px 6px rgba(22, 28, 56, .12), 0 0 0 6px var(--gold); } }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); } 75% { opacity: 1; transform: translate(-50%, -60%) scale(1) rotate(-4deg); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.95) rotate(-4deg); } }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }
@keyframes quake { 10% { transform: translate(-8px, 4px) rotate(-1deg); } 25% { transform: translate(8px, -4px) rotate(1deg); } 40% { transform: translate(-6px, 2px); } 60% { transform: translate(5px, -2px); } 80% { transform: translate(-2px, 1px); } }
@keyframes flash { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.4); } }
@keyframes deal { from { transform: translateY(14px) scale(.85); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* XOX Pop rules: drop X and O pieces on a 5x5 board, three of a kind in a row or column pops. No DOM. */
var Game = (function () {
  'use strict';

  var N = 5, CELLS = N * N, EMPTY = 0, X = 1, O = 2;
  /* tuned with test/sim.js: a random tapper lasts ~30 pieces, a casual player ~100, a careful one ~240.
     mixed: share of multi-square pieces that alternate X and O. big: 4-square shapes, more of them each level.
     fairAll: tries to deal a tray where every piece fits. blastLen: run length that blasts. wipeLen: a cross needs
     one line this long to wipe the board. */
  var cfg = {
    mixedBase: 0.9, mixedStep: 0, mixedMax: 0.9, singleWeight: 2.5, bigStep: 0.5, levelEvery: 15, maxLevel: 8,
    diagonals: false, fairAll: 10, fairTries: 30, blastLen: 4, blastReach: 1, wipe: 'cross', wipeLen: 4, streakCap: 5, cleanBonus: 300
  };

  /* seedable rng so tests and the simulator can replay a game */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* shapes as [row, col] offsets; weight = how often it shows up, big ones grow with the level */
  var SHAPES = [
    { cells: [[0, 0]], weight: 3 },
    { cells: [[0, 0], [0, 1]], weight: 4 },
    { cells: [[0, 0], [1, 0]], weight: 4 },
    { cells: [[0, 0], [0, 1], [0, 2]], weight: 2 },
    { cells: [[0, 0], [1, 0], [2, 0]], weight: 2 },
    { cells: [[0, 0], [1, 0], [1, 1]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 0]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 1]], weight: 1 },
    { cells: [[0, 1], [1, 0], [1, 1]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 0], [1, 1]], weight: 0, big: 1 },
    { cells: [[0, 0], [0, 1], [0, 2], [0, 3]], weight: 0, big: 1 },
    { cells: [[0, 0], [1, 0], [2, 0], [3, 0]], weight: 0, big: 1 },
    { cells: [[0, 0], [0, 1], [0, 2], [1, 1]], weight: 0, big: 1 },
    { cells: [[0, 0], [1, 0], [2, 0], [2, 1]], weight: 0, big: 1 },
    { cells: [[0, 1], [0, 2], [1, 0], [1, 1]], weight: 0, big: 1 }
  ];
  function level(placed) { return Math.min(cfg.maxLevel, Math.floor(placed / cfg.levelEvery)); }

  /* a piece is a list of {r, c, m}; a single-mark piece gets one mark, a mixed one alternates */
  function randomPiece(rand, lv) {
    lv = lv || 0;
    var w = SHAPES.map(function (s, k) { return (k === 0 ? cfg.singleWeight : s.weight) + (s.big ? s.big * cfg.bigStep * lv / 2 : 0); });
    var roll = rand() * w.reduce(function (a, b) { return a + b; }, 0), shape = SHAPES[0];
    for (var i = 0; i < SHAPES.length; i++) { roll -= w[i]; if (roll < 0) { shape = SHAPES[i]; break; } }
    var first = rand() < 0.5 ? X : O;
    var mixed = shape.cells.length > 1 && rand() < Math.min(cfg.mixedMax, cfg.mixedBase + cfg.mixedStep * lv);
    return shape.cells.map(function (rc, k) { return { r: rc[0], c: rc[1], m: mixed && k % 2 ? 3 - first : first }; });
  }

  function size(piece) {
    var h = 0, w = 0;
    piece.forEach(function (p) { h = Math.max(h, p.r + 1); w = Math.max(w, p.c + 1); });
    return { h: h, w: w };
  }

  function fits(board, piece, r, c) {
    for (var i = 0; i < piece.length; i++) {
      var rr = r + piece[i].r, cc = c + piece[i].c;
      if (rr < 0 || rr >= N || cc < 0 || cc >= N || board[rr * N + cc] !== EMPTY) return false;
    }
    return true;
  }
  function fitsAnywhere(board, piece) {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (fits(board, piece, r, c)) return true;
    return false;
  }

  /* every run of 3+ equal marks in a row, column or diagonal. d: 0 across, 1 down, 2 and 3 diagonal */
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  function findRuns(board) {
    var runs = [], hit = {};
    for (var d = 0; d < (cfg.diagonals ? 4 : 2); d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
        var m = board[r * N + c];
        if (m === EMPTY) continue;
        var pr = r - dr, pc = c - dc;
        if (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr * N + pc] === m) continue; /* not the start of a run */
        var cells = [], rr = r, cc = c;
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr * N + cc] === m) { cells.push(rr * N + cc); rr += dr; cc += dc; }
        if (cells.length >= 3) { runs.push({ d: d, cells: cells }); cells.forEach(function (k) { hit[k] = 1; }); }
      }
    }
    return { runs: runs, cells: Object.keys(hit).map(Number), lines: runs.length };
  }

  /* what a board with fresh runs turns into:
     popped  the runs themselves
     blasted extra squares: a run of 4+ across blasts its row and the rows next to it, down blasts columns,
             a diagonal blasts every square touching it
     wipe    a run across and a run down from the same piece clear the whole board
             (cfg.wipe 'cross': only when the two lines share a square, 'any': whenever both happen) */
  function resolve(board) {
    var found = findRuns(board), popped = found.cells, blast = {}, blasts = 0, across = {}, down = {};
    found.runs.forEach(function (run) {
      if (run.d === 0) run.cells.forEach(function (k) { across[k] = 1; });
      if (run.d === 1) run.cells.forEach(function (k) { down[k] = 1; });
      if (run.cells.length < cfg.blastLen) return;
      blasts++;
      var r0 = Math.floor(run.cells[0] / N), c0 = run.cells[0] % N, k, j;
      if (run.d === 0) { for (k = r0 - cfg.blastReach; k <= r0 + cfg.blastReach; k++) if (k >= 0 && k < N) for (j = 0; j < N; j++) blast[k * N + j] = 1; }
      else if (run.d === 1) { for (k = c0 - cfg.blastReach; k <= c0 + cfg.blastReach; k++) if (k >= 0 && k < N) for (j = 0; j < N; j++) blast[j * N + k] = 1; }
      else run.cells.forEach(function (cell) { around(cell).forEach(function (n) { blast[n] = 1; }); });
    });
    var a = Object.keys(across), dn = Object.keys(down);
    var wipe = (cfg.wipe === 'any' ? a.length > 0 && dn.length > 0 : cfg.wipe === 'cross' && a.some(function (k) { return down[k]; })) &&
      (a.length >= cfg.wipeLen || dn.length >= cfg.wipeLen);
    if (wipe) for (var i = 0; i < CELLS; i++) blast[i] = 1;
    popped.forEach(function (k) { delete blast[k]; });
    var blasted = Object.keys(blast).map(Number).filter(function (k) { return board[k] !== EMPTY; });
    return { popped: popped, blasted: blasted, lines: found.lines, blasts: blasts, wipe: wipe };
  }
  function around(k) {
    var r = Math.floor(k / N), c = k % N, out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      var rr = r + dr, cc = c + dc;
      if ((dr || dc) && rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
    }
    return out;
  }

  /* new tray of three. Mercy: try for a tray where every piece fits (cfg.fairAll tries), then for one where at least one fits */
  function newTray(board, rand, lv) {
    var tray, t, fit = function (p) { return fitsAnywhere(board, p); };
    for (t = 0; t < cfg.fairAll; t++) {
      tray = [randomPiece(rand, lv), randomPiece(rand, lv), randomPiece(rand, lv)];
      if (tray.every(fit)) return tray;
    }

  function spark(p, color, n, spread) {
    for (var j = 0; j < n; j++) {
      var s = document.createElement('i'), a = Math.random() * Math.PI * 2, dist = spread * (0.5 + Math.random());
      s.className = 'spark';
      s.style.cssText = 'left:' + p.x + 'px;top:' + p.y + 'px;background:' + color + ';--dx:' + Math.cos(a) * dist + 'px;--dy:' + Math.sin(a) * dist + 'px';
      els.fx.appendChild(s);
      setTimeout(s.remove.bind(s), 700);
    }
  }
  function float(cls, text, x, y) {
    var el = document.createElement('div');
    el.className = cls; el.textContent = text;
    if (x !== undefined) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
    els.fx.appendChild(el); setTimeout(el.remove.bind(el), 1300);
  }
  /* returns how long the board animation runs */
  function effects(res, before) {
    var center = centroid(res.popped), maxDelay = 0;
    res.popped.forEach(function (k) { drawCell(k, before[k], 'pop'); spark(cellCenter(k), 'var(--' + mc(before[k]) + ')', 5, 45); });
    res.blasted.forEach(function (k) {
      var p = cellCenter(k), delay = Math.round(Math.min(320, Math.hypot(p.x - center.x, p.y - center.y) * 1.1));
      maxDelay = Math.max(maxDelay, delay);
      drawCell(k, before[k], 'blast');
      els.cells[k].style.setProperty('--d', delay + 'ms');
      setTimeout(function () { spark(p, 'var(--' + mc(before[k]) + ')', 3, 35); }, delay);
    });
    float('gain', '+' + fmt(res.gained), center.x, center.y);
    var word = res.wipe ? 'BOARD WIPE!' : res.blasts >= 2 ? 'MEGA BLAST!' : res.blasts ? 'BLAST!' : res.clean ? 'CLEAN!' :
      res.lines >= 3 ? 'Triple!' : res.lines === 2 ? 'Double!' : res.streak >= 3 ? 'On fire!' : res.streak === 2 ? 'Nice!' : '';
    if (word) float('banner' + (res.wipe || res.blasts ? ' big' : ''), word);
    if (res.clean && (res.wipe || res.blasts)) setTimeout(function () { float('banner small', 'Clean board +' + fmt(G.cfg.cleanBonus * Math.min(res.streak, G.cfg.streakCap))); }, 500);
    if (res.wipe) {
      var fl = document.createElement('div'); fl.className = 'flash'; els.fx.appendChild(fl); setTimeout(fl.remove.bind(fl), 700);
      sfx.wipe(); buzz([40, 40, 40, 40, 90]);
    } else if (res.blasts) { sfx.blast(); sfx.pop(res.lines, res.streak); buzz([30, 30, 60]); }
    else { sfx.pop(res.lines, res.streak); buzz(res.lines >= 2 ? [20, 40, 30] : 20); }
    if (res.blasts || res.wipe) bump(els.board, 'quake'); else if (res.lines >= 2) bump(els.board, 'shake');
    return 360 + maxDelay;
  }

  function newBest() {
    float('banner best', 'NEW BEST!');
    var w = els.wrap.getBoundingClientRect();
    for (var j = 0; j < 4; j++) spark({ x: w.width * (0.2 + 0.2 * j), y: w.height * 0.45 }, 'var(--gold)', 8, 70);
    bump(els.score, 'bump');
    sfx.best(); buzz([20, 30, 20, 30, 40]);
  }

  function gameOver() {
    sfx.over(); buzz([30, 60, 30]);
    var old = st.beat, isBest = st.passed || (old === 0 && st.score > 0), s = streak(), line;
    if (isBest) line = '<span class="newbest">NEW BEST</span>' + (old > 0 ? '<p>' + fmt(st.score - old) + ' more than your old best</p>' : '');
    else if (old > 0 && old - st.score <= old * 0.25) line = '<p class="close">So close! Only <b>' + fmt(old - st.score) + '</b> short of your best.</p>';
    else line = '<p>Best ' + fmt(old) + '</p>';
    var extras = [st.placed + ' pieces', st.pops + ' pops'];
    if (st.blasts) extras.push(st.blasts + (st.blasts === 1 ? ' blast' : ' blasts'));
    if (st.wipes) extras.push(st.wipes + (st.wipes === 1 ? ' wipe' : ' wipes'));
    var daily = '';
    if (mode === 'daily') {
      var dots = '';
      for (var d = 6; d >= 0; d--) {
        var k = shiftDay(today, -d), p = k.split('-');
        dots += '<span class="day' + (days[k] !== undefined ? ' on' : '') + (d === 0 ? ' now' : '') + '"><i></i>' +
          new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { weekday: 'narrow' }) + '</span>';
      }
      daily = '<div class="week">' + dots + '</div><p class="streak-line">' + FLAME + s.n + (s.n === 1 ? ' day' : ' days') + ' in a row · come back tomorrow for new pieces</p>';
    }
    var ov = document.createElement('div');
    ov.className = 'over';
    ov.innerHTML = '<div class="over-card" role="dialog" aria-label="Game over">' +
      '<h2>' + (mode === 'daily' ? 'Daily · ' + dayLabel(today) : 'No more room') + '</h2>' +
      '<div class="big">' + fmt(st.score) + '</div>' + line + daily +
      '<p class="extras">' + extras.join(' · ') + '</p>' +
      '<button class="play" id="again">' + (mode === 'daily' ? 'Try again' : 'Play again') + '</button>' +
      (mode === 'classic' && days[today] === undefined ? '<button class="alt" id="other">' + FLAME + 'Play today\'s daily</button>'
        : mode === 'daily' ? '<button class="alt" id="other">Play classic</button>' : '') +
      '</div>';
    document.body.appendChild(ov);
    document.getElementById('again').addEventListener('click', function () { ov.remove(); newGame(); });
    var other = document.getElementById('other');
    if (other) other.addEventListener('click', function () { ov.remove(); switchMode(mode === 'daily' ? 'classic' : 'daily', true); });
  }

  function newGame() { disarm(); st = freshGame(mode); sel = -1; save(); renderAll(); }
  function switchMode(m, fresh) {
    if (m === mode && !fresh) return;
    if (busy || drag) return;
    disarm(); save();
    mode = m; lsSet(K.mode, m);
    today = dayKey();
    st = fresh ? freshGame(m) : loadGame(m); sel = -1; save();
    renderAll();
  }
  /* restart needs two taps so a stray thumb does not wipe a good game */
  function disarm() { if (armed) { clearTimeout(armed); armed = 0; els.restart.classList.remove('armed'); } }
  function restartTap() {
    if (st.placed === 0 || st.over) { newGame(); return; }
    if (armed) { newGame(); return; }
    armed = setTimeout(function () { disarm(); renderStatus(); }, 2500);
    els.restart.classList.add('armed'); renderStatus();
  }
  function toggleSound() {
    soundOn = !soundOn; lsSet(K.sound, soundOn ? '1' : '0'); renderSound();
    if (soundOn) sfx.pick();
  }
  /* a new day while the app sat in the background: fresh daily pieces */
  function checkDay() {
    if (dayKey() === today) return;
    today = dayKey();
    if (mode === 'daily' && !busy && !drag && !document.querySelector('.over')) { st = freshGame('daily'); save(); renderAll(); } else renderModes();
  }

  /* ---------- start ---------- */
  today = dayKey();
  best = +lsGet(K.best) || 0;
  days = lsJson(K.days) || {};
  soundOn = lsGet(K.sound) !== '0';
  seen = lsGet(K.seen) === '1';
  mode = lsGet(K.mode) === 'daily' ? 'daily' : 'classic';
  st = loadGame(mode); save();
  build();
  renderAll();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  /* offline after the first visit when served over http(s) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* not available here */ }); });
  }
})();

</script>
