<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>XOX Rogue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, a graph-paper board, and riso-style two-ink marks that overprint. */
:root {
  --paper: #ECEFF4;
  --paper2: #E0E6F0;
  --ink: #161C38;
  --ink2: #4A5376;
  --rule: #B6C0D4;
  --x: #1D4FFF;
  --o: #E8247A;
  --hi: #FFD400;
  --x-soft: rgba(29, 79, 255, .26);
  --o-soft: rgba(232, 36, 122, .26);
  --hi-soft: rgba(255, 212, 0, .5);
  --blend: multiply;
  --f-display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --f-body: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Spline Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10142A; --paper2: #1A2040; --ink: #EEF0FF; --ink2: #9CA6D2; --rule: #2C3563;
    --x: #5E88FF; --o: #FF5C9F; --hi: #FFD400;
    --x-soft: rgba(94, 136, 255, .3); --o-soft: rgba(255, 92, 159, .3); --hi-soft: rgba(255, 212, 0, .28);
    --blend: screen; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10142A; --paper2: #1A2040; --ink: #EEF0FF; --ink2: #9CA6D2; --rule: #2C3563;
  --x: #5E88FF; --o: #FF5C9F; --hi: #FFD400;
  --x-soft: rgba(94, 136, 255, .3); --o-soft: rgba(255, 92, 159, .3); --hi-soft: rgba(255, 212, 0, .28);
  --blend: screen; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45; font-weight: 450;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.05; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 28px; }
h3 { font-size: 18px; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
small { font-size: 13px; }

.shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 12px 36px;
  overflow-x: clip;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell > * { min-width: 0; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  min-height: 48px; padding: 8px 18px; border: 2px solid var(--ink); border-radius: 3px;
  background: var(--paper); color: var(--ink); cursor: pointer;
  font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.1; letter-spacing: .01em;
  box-shadow: 3px 3px 0 var(--rule);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn small { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; opacity: .75; }
.btn.primary { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--x); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--x); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .4; cursor: default; box-shadow: none; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; padding: 8px 4px; margin: -8px -4px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.where { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.stats { display: flex; align-items: center; gap: 12px; }
.hearts { display: inline-flex; gap: 2px; }
.heart { width: 20px; height: 20px; }
.heart path { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.heart.full path { fill: var(--ink); }
.gold { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.coin { width: 20px; height: 20px; }
.coin circle:first-child { fill: var(--hi); stroke: var(--ink); stroke-width: 1.8; }
.coin circle:last-child { fill: none; stroke: var(--ink); stroke-width: 1.4; }

/* progress strip: three acts, three matches and a boss each */
.strip { display: flex; gap: 14px; align-items: center; }
.strip .act { display: flex; align-items: center; gap: 5px; }
.strip .al { font-family: var(--f-mono); font-size: 10px; color: var(--ink2); margin-right: 2px; }
.strip i { width: 11px; height: 11px; border: 1.5px solid var(--ink2); display: block; background: transparent; }
.strip i.boss { transform: rotate(45deg) scale(.9); }
.strip i.done { background: var(--ink); border-color: var(--ink); }
.strip i.now { background: var(--hi); border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }

/* title */
.hero { position: relative; padding-top: 6px; display: flex; flex-direction: column; gap: 14px; }
.logo { display: flex; justify-content: center; align-items: center; font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: clamp(110px, 40vw, 190px); line-height: .82; letter-spacing: -.06em; padding: 14px 0 6px; user-select: none; }
.logo span { mix-blend-mode: var(--blend); display: block; }
.logo .lx { color: var(--x); }
.logo .lo { color: var(--o); margin-inline: -.17em; transform: translateY(.03em); }
.logo .lx2 { color: var(--x); transform: translate(.025em, -.02em); }
.sub-logo { text-align: center; }
.lede { font-size: 19px; line-height: 1.35; max-width: 34ch; margin-inline: auto; text-align: center; text-wrap: balance; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.rules { display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--ink); padding-top: 14px; }
.rules p { font-size: 15px; color: var(--ink); }
.rules p b { font-weight: 700; }

/* status */
.status { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-top: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); }
.status p { font-weight: 600; font-size: 16px; flex: 1 1 180px; }
.status .ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.dots::after { content: '...'; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.1s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip.good { border-color: var(--x); background: var(--x-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1.5px solid var(--o); border-radius: 2px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; background: var(--o-soft); }

/* 5x5 board */
.board5 {
  display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 440px; margin-inline: auto;
  border: 2px solid var(--ink); background: var(--paper);
  background-image: radial-gradient(var(--rule) .9px, transparent 1.1px); background-size: 8px 8px;
}
.cell { position: relative; aspect-ratio: 1; min-width: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-right: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); }
.board5 .cell:nth-child(5n) { border-right: 0; }
.board5 .cell:nth-child(n+21) { border-bottom: 0; }
.cell svg.m { position: absolute; inset: 13%; width: 74%; height: 74%; mix-blend-mode: var(--blend); overflow: visible; }
.cell svg.m * { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
.cell.x { color: var(--x); }
.cell.o { color: var(--o); }
.cell.x svg.m { filter: drop-shadow(2px 1.5px 0 var(--x-soft)); }
.cell.o svg.m { filter: drop-shadow(-2px 1.5px 0 var(--o-soft)); }
.cell.stone { color: var(--ink2); cursor: default; }
.cell.stone svg.m * { stroke-width: 3; }
.cell.stone svg.m rect { fill: var(--rule); }
.cell.ghost svg.m { opacity: .55; }
.cell.ghost svg.m * { stroke-dasharray: 5 6; }
.cell.shield::after { content: ''; position: absolute; inset: 6%; border: 2px solid var(--o); border-radius: 50%; opacity: .7; pointer-events: none; }
.cell.ban::before { content: ''; position: absolute; inset: 8%; border: 2px dashed var(--ink); border-radius: 3px; opacity: .55; pointer-events: none; }
.cell.hint { background: var(--hi-soft); animation: pulse 1s ease-in-out infinite; }
.cell.hint::after { content: ''; position: absolute; inset: 5%; border: 3px solid var(--ink); border-radius: 50%; pointer-events: none; }
@keyframes pulse { 50% { background: transparent; } }
.cell.sel { background: var(--hi-soft); box-shadow: inset 0 0 0 3px var(--ink); }
.cell.win { background: var(--hi-soft); box-shadow: inset 0 0 0 3px var(--ink); }
.cell.last i.dot { position: absolute; top: 6px; left: 6px; width: 8px; height: 8px; background: var(--o); border-radius: 50%; }
.cell i.tag { position: absolute; right: 4px; bottom: 3px; font-family: var(--f-mono); font-style: normal; font-weight: 700; font-size: 10px; letter-spacing: .04em; }
.cell.ofrom::before { content: ''; position: absolute; inset: 8%; border: 2px dashed var(--x); border-radius: 50%; pointer-events: none; }
.cell.oto { box-shadow: inset 0 0 0 3px var(--o); }
.cell.fresh.x svg.m path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .22s ease-out forwards; }
.cell.fresh.o svg.m circle { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .26s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell:disabled { cursor: default; }

/* Super XOX */
.board9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; max-width: 440px; margin-inline: auto; }
.board9.turn { animation: turn .5s cubic-bezier(.3, .7, .2, 1); }
@keyframes turn { from { transform: rotate(-90deg) scale(.78); } to { transform: rotate(0) scale(1); } }
.sub { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink2); background: var(--paper); opacity: .62; }
.sub.live { opacity: 1; border-color: var(--ink); background: var(--hi-soft); box-shadow: 0 0 0 2px var(--ink); }
.sub.free { opacity: 1; border-style: dashed; }
.sub.won { opacity: 1; }
.sub.won .cell svg.m { opacity: .28; }
.sub.dead { opacity: .4; }
.sub .cell { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.sub .cell:nth-of-type(3n) { border-right: 0; }
.sub .cell:nth-of-type(n+7) { border-bottom: 0; }
.sub .cell svg.m * { stroke-width: 6; }
.sub .cell.legal::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; background: var(--ink); border-radius: 50%; opacity: .5; }
.sub .big { position: absolute; inset: 10%; pointer-events: none; display: grid; place-items: center; }
.sub .big svg { width: 100%; height: 100%; mix-blend-mode: var(--blend); overflow: visible; }
.sub .big svg * { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
.sub.wx .big { color: var(--x); }
.sub.wo .big { color: var(--o); }
.sub.dead .big { color: var(--ink2); font-family: var(--f-mono); font-size: 12px; }
.sub .badge { position: absolute; left: 3px; top: 3px; padding: 1px 4px; font-family: var(--f-mono); font-size: 9px; letter-spacing: .05em; font-weight: 700; background: var(--ink); color: var(--paper); z-index: 2; pointer-events: none; }
.sub .badge.mine { left: auto; right: 3px; background: var(--hi); color: #161C38; }
.sub.pick { cursor: pointer; outline: 3px dashed var(--ink); outline-offset: 2px; opacity: 1; }
.sub.lastb { box-shadow: 0 0 0 2px var(--o); }
.boss-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--f-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; display: flex; gap: 10px; }
.score b { font-weight: 700; }

/* relic tray */
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.relic { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 6px 10px; text-align: left; background: var(--paper2); border: 1.5px solid var(--ink); border-radius: 3px; cursor: pointer; min-width: 0; }
.relic .ic { width: 30px; height: 30px; flex: none; }
.relic .t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.relic .rn { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.05; overflow-wrap: anywhere; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 11px; height: 11px; border: 1.5px solid var(--ink); border-radius: 50%; display: block; }
.pips i.on { background: var(--ink); }
.relic .pl { font-family: var(--f-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); }
.relic[aria-pressed="true"] { background: var(--hi); color: #161C38; box-shadow: 3px 3px 0 var(--ink); }
.relic[aria-pressed="true"] .pips i { border-color: #161C38; } .relic[aria-pressed="true"] .pips i.on { background: #161C38; }
.relic.empty { opacity: .45; }
.relic.passive { background: transparent; border-style: dashed; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* cards */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: 44px 1fr; gap: 6px 12px; align-items: start; text-align: left; width: 100%; padding: 12px; border: 2px solid var(--ink); border-radius: 3px; background: var(--paper2); cursor: pointer; box-shadow: 3px 3px 0 var(--rule); }
.card .ic { width: 36px; height: 36px; margin-top: 2px; }
.card .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card h3 { font-size: 19px; }
.card p { font-size: 15px; color: var(--ink2); }
.card .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card.static { cursor: default; }
.card[aria-pressed="true"] { background: var(--hi); color: #161C38; box-shadow: 3px 3px 0 var(--ink); }
.card[aria-pressed="true"] p { color: #161C38; }
.card.counter { grid-template-columns: 1fr; border-color: var(--o); background: var(--o-soft); box-shadow: none; cursor: default; }
.card.boss { grid-template-columns: 1fr; box-shadow: none; cursor: default; }
.card:active:not(.static):not(.counter):not(.boss) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--x); }
.tag-line { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }

/* result */
.result { border: 2px solid var(--ink); border-radius: 3px; padding: 14px; background: var(--paper2); display: flex; flex-direction: column; gap: 12px; box-shadow: 4px 4px 0 var(--x); }
.result.loss { box-shadow: 4px 4px 0 var(--o); }
.result h2 { font-size: 30px; }
.lines { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.lines div { display: flex; justify-content: space-between; gap: 10px; }
.lines .v { font-family: var(--f-mono); font-weight: 600; }
.lines .n { color: var(--ink2); }

dl.sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 0; }
dl.sum dt { color: var(--ink2); } dl.sum dd { margin: 0; font-family: var(--f-mono); font-weight: 600; text-align: right; }

@media (max-width: 380px) {
  h2 { font-size: 25px; }
  .tray { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .cell.fresh.x svg.m path, .cell.fresh.o svg.m circle { stroke-dasharray: none; stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* XOX Rogue engine: 5x5 four-in-a-row search AI and Super XOX (ultimate tic-tac-toe). No DOM. */
var XOX = (function () {
  'use strict';

  var N = 5, NC = 25, FULL = (1 << 25) - 1;
  var WIN = 100000;

  function pc(x) {
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    return (((x + (x >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24;
  }

  /* ---------- 5x5: lines ---------- */
  var WINDOWS = (function () {
    var out = [], dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) for (var d = 0; d < 4; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var er = r + 3 * dr, ec = c + 3 * dc;
      if (er < 0 || er >= N || ec < 0 || ec >= N) continue;
      var m = 0;
      for (var k = 0; k < 4; k++) m |= 1 << ((r + k * dr) * N + c + k * dc);
      out.push(m);
    }
    return out;
  })();

  var PATTERNS = {
    corners: (1 << 0) | (1 << 4) | (1 << 20) | (1 << 24),
    plus: (1 << 12) | (1 << 7) | (1 << 17) | (1 << 11) | (1 << 13)
  };

  function cellLines(lines) {
    var cl = [];
    for (var c = 0; c < NC; c++) {
      var a = [];
      for (var i = 0; i < lines.length; i++) if (lines[i] & (1 << c)) a.push(lines[i]);
      cl.push(a);
    }
    return cl;
  }

  /* extras: extra winning patterns (bit masks) for X only */
  function makeRules(extras) {
    var lx = WINDOWS.concat(extras || []);
    return { lines: [lx, WINDOWS], cl: [cellLines(lx), cellLines(WINDOWS)] };
  }

  function lineWon(mask, lines) {
    for (var i = 0; i < lines.length; i++) if ((mask & lines[i]) === lines[i]) return lines[i];
    return 0;
  }

  /* ---------- 5x5: search ---------- */
  var CENTER = [];
  for (var ci = 0; ci < NC; ci++) {
    var rr = Math.floor(ci / N), cc = ci % N;
    CENTER.push(4 - (Math.abs(rr - 2) + Math.abs(cc - 2)));
  }
  var W = [0, 1, 5, 25, 120, 0];

  /* st: {x,o,b,ban}. side: 0 = X, 1 = O (the side to move at the root).
     ban = cells only X may use. Returns {move, score, depth, nodes}. */
  function search5(st, rules, side, timeMs, opts) {
    opts = opts || {};
    var lines = rules.lines, cl = rules.cl;
    var blocked = st.b | 0, ban = st.ban | 0;
    var maxDepth = opts.maxDepth || 40;
    var deadline = Date.now() + timeMs;
    var nodes = 0, aborted = false;
    var tt = new Map();
    var lx = lines[0], lo = lines[1];

    function evalX(mx, mo) {
      var s = 0, i, l;
      for (i = 0; i < lx.length; i++) { l = lx[i]; if ((l & blocked) === 0 && (mo & l) === 0) s += W[pc(mx & l)]; }
      for (i = 0; i < lo.length; i++) { l = lo[i]; if ((l & blocked) === 0 && (mx & l) === 0) s -= W[pc(mo & l)]; }
      return s;
    }
    function wins(mask, c, s) {
      var a = cl[s][c], m2 = mask | (1 << c);
      for (var i = 0; i < a.length; i++) if ((m2 & a[i]) === a[i]) return true;
      return false;
    }
    function moveHeur(me, op, c, s) {
      var a = cl[s][c], h = CENTER[c], i, l;
      for (i = 0; i < a.length; i++) { l = a[i]; if ((l & blocked) === 0 && (op & l) === 0) h += W[pc(me & l) + 1] * 2; }
      var b = cl[s ^ 1][c];
      for (i = 0; i < b.length; i++) { l = b[i]; if ((l & blocked) === 0 && (me & l) === 0) h += W[pc(op & l) + 1]; }
      return h;
    }
    function orderedMoves(avail, me, op, s, ttMove) {
      var arr = [];
      for (var c = 0; c < NC; c++) if (avail & (1 << c)) arr.push({ c: c, h: c === ttMove ? 1e9 : moveHeur(me, op, c, s) });
      arr.sort(function (p, q) { return q.h - p.h; });
      return arr;
    }

    function nm(mx, mo, s, d, alpha, beta, ply) {
      if ((++nodes & 2047) === 0 && Date.now() > deadline) aborted = true;
      if (aborted) return 0;
      var me = s === 0 ? mx : mo, op = s === 0 ? mo : mx;
      var occ = mx | mo | blocked;
      var availMe = FULL & ~occ; if (s === 1) availMe &= ~ban;
      var availOp = FULL & ~occ; if (s === 0) availOp &= ~ban;

    for (var a = 1; a <= 3; a++) {
      out += '<div class="act"><span class="al">A' + a + '</span>';
      for (var k = 0; k < 4; k++) {
        var n = (a - 1) * 4 + k;
        out += '<i class="' + (k === 3 ? 'boss ' : '') + (n < cur ? 'done' : (n === cur ? 'now' : '')) + '"></i>';
      }
      out += '</div>';
    }
    return out + '</div>';
  }
  function maxCharges(id) { return (G.RELICS[id].charges || 0) + (G.has(run, 'battery') ? 1 : 0); }
  function pips(n, max) { var s = ''; for (var i = 0; i < max; i++) s += '<i class="' + (i < n ? 'on' : '') + '"></i>'; return '<span class="pips" aria-hidden="true">' + s + '</span>'; }

  /* ---------- screens ---------- */
  function screenTitle() {
    var b = ui.best, s = ui.saved;
    var farthest = b.farthest ? 'Furthest so far: act ' + (Math.floor((b.farthest - 1) / 4) + 1) + ', ' + (((b.farthest - 1) % 4) === 3 ? 'boss' : 'match ' + (((b.farthest - 1) % 4) + 1)) + (b.victories ? ' · ' + b.victories + (b.victories === 1 ? ' run cleared' : ' runs cleared') : '') : '';
    return '<section class="hero">' +
      '<div class="logo" aria-hidden="true"><span class="lx">X</span><span class="lo">O</span><span class="lx2">X</span></div>' +
      '<h1 class="sub-logo mono" style="font-size:13px;font-weight:600;letter-spacing:.14em">XOX Rogue</h1>' +
      '<p class="lede">Tic-tac-toe against an AI that never blunders. You cannot outplay it, so out-build it.</p>' +
      '<div class="stack">' +
        '<button class="btn primary block" data-act="new">Start a run</button>' +
        (s ? '<button class="btn block" data-act="continue">Continue run <small>' + whereText(s) + '</small></button>' : '') +
      '</div>' +
      (farthest ? '<p class="mono" style="text-align:center">' + farthest + '</p>' : '') +
      '<div class="rules">' +
        '<p><b>Four in a row wins</b> on a 5×5 board. You move first. A plain game is a draw.</p>' +
        '<p><b>Relics bend the rules.</b> Their charges refill at the start of each act, so spend them where they count.</p>' +
        '<p><b>Win matches to earn gold</b> and buy more relics. Hearts run out when you draw or lose.</p>' +
        '<p><b>Each act ends in Super XOX:</b> nine small boards, where your move sends the boss to the matching board.</p>' +
      '</div></section>';
  }

  function useTag(id) {
    var r = G.RELICS[id];
    if (!r) return 'Boss trick';
    return r.kind === 'active' ? 'Button \u00B7 ' + r.charges + (r.charges > 1 ? ' uses' : ' use') + ' per act' : 'Automatic';
  }

  function relicCardBtn(id, act, label) {
    var r = info(id);
    return '<button class="card" data-act="' + act + '" data-id="' + id + '">' + ic(id) +
      '<span class="body"><h3>' + r.name + '</h3><p>' + r.desc + '</p></span>' +
      '<span class="foot"><span class="tag-line">' + useTag(id) + '</span><span class="btn sm primary" aria-hidden="true">' + label + '</span></span></button>';
  }

  function screenStarter() {
    return header('New run') +
      '<h2>Pick your first relic</h2>' +
      '<p>Each one is a way to beat the AI. You can buy more after every win.</p>' +
      '<div class="cards">' + run.starters.map(function (id) { return relicCardBtn(id, 'starter', 'Take'); }).join('') + '</div>';
  }

  function ownedRelics() {
    if (!run.relics.length) return '';
    return '<div class="stack"><p class="mono">Your relics</p><div class="tray">' + run.relics.map(function (id) {
      var r = G.RELICS[id], act = r.kind === 'active';
      return '<div class="relic ' + (act ? '' : 'passive') + '" style="cursor:default">' + ic(id) + '<span class="t"><span class="rn">' + r.name + '</span>' + (act ? pips(run.charges[id] || 0, maxCharges(id)) : '<span class="pl">Automatic</span>') + '</span></div>';
    }).join('') + '</div></div>';
  }

  function screenBriefing() {
    var boss = run.idx === 3, out = header(whereText(run)) + strip();
    if (!boss) {
      out += '<h2>' + whereText(run) + '</h2>';
      if (run.counters.length) {
        out += '<div class="stack"><p class="mono">AI relics this match</p><div class="cards">' + run.counters.map(function (id) {
          return '<div class="card counter"><span class="body"><h3>' + G.COUNTERS[id].name + '</h3><p>' + G.COUNTERS[id].desc + '</p></span></div>';
        }).join('') + '</div></div>';
      } else {
        out += '<p>The AI has no relics yet. Act 2 gives it one per match.</p>';
      }
      out += ownedRelics() + '<button class="btn primary block" data-act="startmatch">Start match</button>';
    } else {
      var b = G.BOSSES[run.act - 1];
      out += '<h2>Boss: ' + b.name + '</h2>' +
        '<div class="card boss"><span class="body"><p class="tag-line">Super XOX</p><p style="color:var(--ink);font-size:16px">Nine small boards. Win three in a row to win the match. The square you play in sends the boss to the board in the same position. ' + b.blurb + '</p></span></div>' +
        '<div class="stack"><p class="mono">Pick one trick for this fight</p><div class="cards">' + run.trickChoices.map(function (id) {
          var t = G.TRICKS[id], on = run.trick === id;
          return '<button class="card" data-act="trick" data-id="' + id + '" aria-pressed="' + on + '">' + ic(id) + '<span class="body"><h3>' + t.name + '</h3><p>' + t.desc + '</p></span></button>';
        }).join('') + '</div></div>' +
        (run.relics.some(function (id) { return id === 'rewind' || id === 'hint'; }) ? '<p class="tag-line">Rewind and Hint also work here.</p>' : '') +
        '<button class="btn primary block" data-act="startmatch"' + (run.trick ? '' : ' disabled') + '>' + (run.trick ? 'Start the boss fight' : 'Pick a trick first') + '</button>';
    }
    return out;
  }

  /* ----- 5x5 ----- */
  function cellLabel(m, i) {
    var b = 1 << i, st = 'empty';
    if (m.b & b) st = 'blocked'; else if (m.x & b) st = 'your mark'; else if (m.o & b) st = 'AI mark';
    return 'Row ' + (Math.floor(i / 5) + 1) + ', column ' + (i % 5 + 1) + ': ' + st;
  }
  function board5(m) {
    var fresh = (m.x & ~ui.prevX) | (m.o & ~ui.prevO), out = '<div class="board5" role="group" aria-label="5 by 5 board">';
    for (var i = 0; i < 25; i++) {
      var b = 1 << i, cls = 'cell', inner = '';
      if (m.b & b) { cls += ' stone'; inner = STONE; }
      else if (m.x & b) { cls += ' x'; inner = XM; }
      else if (m.o & b) { cls += ' o'; inner = OM; }
      if (fresh & b) cls += ' fresh';
      if (m.winMask & b) cls += ' win';
      if (m.hint === i) cls += ' hint';
      if (m.lastAI === i && (m.o & b) && !m.over) { cls += ' last'; inner += '<i class="dot"></i>'; }
      out += '<button class="' + cls + '" data-act="cell" data-i="' + i + '" aria-label="' + cellLabel(m, i) + '">' + inner + '</button>';
    }
    return out + '</div>';
  }

  function statusHtml(m) {
    var text;
    if (run.phase === 'result') {
      var o = run.result;
      if (o.boss) text = o.outcome === 'win' ? 'You took the boss down.' : 'The boss fight is over.';
      else if (m.over === 'win') text = 'You broke the draw.';
      else if (o.outcome === 'win') text = 'Counted as a win.';
      else text = m.over === 'draw' ? 'No line left to win.' : 'The AI got four in a row.';
    } else if (ui.thinking) text = '<span class="dots">The AI is thinking</span>';
    else if (ui.msg) text = esc(ui.msg);
    else if (m.kind === '5' && m.perks.strike && m.xTurns % 3 === 2) text = 'Double Strike turn: place 2 marks.';
    else if (m.kind === '5') text = 'Your move. Four in a row wins.';
    else if (m.extra > 0) text = 'Overplay: you move twice.';
    else text = m.S.next >= 0 ? 'Play in the highlighted board.' : 'The boss sent you anywhere. Play on any open board.';
    return '<div class="status" aria-live="polite"><p>' + text + '</p></div>';
  }

  function trayHtml(m) {
    var live = run.phase === 'match' && m.turn === 'X' && !m.over && !ui.thinking, items = [];
    if (m.kind === '5') {
      run.relics.forEach(function (id) {
        var r = G.RELICS[id];
        if (r.kind === 'active') items.push({ id: id, active: true, n: m.charges[id] || 0, max: maxCharges(id) });
        else items.push({ id: id, active: false });
      });
    } else {
      if (m.trick === 'overplay' || m.trick === 'freepass') items.push({ id: m.trick, active: true, n: m.charges[m.trick] || 0, max: 1 + (G.has(run, 'battery') ? 1 : 0) });
      else if (m.trick) items.push({ id: m.trick, active: false, trick: true });
      ['rewind', 'hint'].forEach(function (id) { if (m.charges[id] !== undefined) items.push({ id: id, active: true, n: m.charges[id], max: maxCharges(id) }); });
    }
    if (!items.length) return '';
    return '<div class="tray">' + items.map(function (it) {
      var r = info(it.id), empty = it.active && it.n < 1;
      var armed = (it.id === 'freeze' && m.kind === '5' && m.freeze > 0) || (it.id === 'overplay' && m.kind === 'boss' && m.extra > 0);
      return '<button class="relic' + (it.active ? '' : ' passive') + (empty ? ' empty' : '') + '" data-act="relic" data-id="' + it.id + '" aria-pressed="' + (armed ? 'true' : 'false') + '" title="' + esc(r.desc) + '"' + (it.active && !live ? ' aria-disabled="true"' : '') + '>' +
        ic(it.id) + '<span class="t"><span class="rn">' + r.name + '</span>' + (it.active ? pips(it.n, it.max) : '<span class="pl">' + (it.trick ? 'Boss trick' : 'Automatic') + '</span>') + '</span></button>';
    }).join('') + '</div>';
  }

  function nextLabel() {
    var o = run.result;
    if (run.hearts <= 0) return 'See results';
    if (o.boss && o.outcome === 'win') return 'Choose a relic';
    if (!o.boss && o.outcome === 'win') return 'Visit the shop';
    if (run.idx === 3 && run.act === 3) return 'See results';
    return run.idx === 2 ? 'On to the boss' : 'Next match';
  }
  function resultHtml() {
    var o = run.result, win = o.outcome === 'win', rows = '', bonus = 0;
    o.bonuses.forEach(function (b) { bonus += b[1]; });
    if (o.gold) rows += '<div><span>' + (o.boss ? 'Boss reward' : 'Match won') + '</span><span class="v">+' + (o.gold - bonus) + ' gold</span></div>';
    o.bonuses.forEach(function (b) { rows += '<div><span>' + b[0] + '</span><span class="v">+' + b[1] + ' gold</span></div>'; });
    if (o.hearts) rows += '<div><span>Hearts lost</span><span class="v">−' + o.hearts + '</span></div>';
    if (!o.gold && !o.hearts) rows += '<div><span>' + (o.outcome === 'draw' ? 'Act 1 draws cost nothing.' : '') + '</span><span class="v"></span></div>';
    o.notes.forEach(function (n) { rows += '<div><span class="n">' + esc(n) + '</span><span class="v"></span></div>'; });
    var title = o.boss ? (win ? 'Boss beaten' : (o.outcome === 'draw' ? 'Boss held on' : 'The boss wins')) : (win ? 'You won' : (o.outcome === 'draw' ? 'Draw' : 'You lost'));
    return '<div class="result ' + (win ? '' : 'loss') + '"><h2>' + title + '</h2><div class="lines">' + rows + '</div>' +
      '<button class="btn primary block" data-act="next">' + nextLabel() + '</button></div>';
  }

  function counterBar(m) {
    var out = '';
    if (m.counters && m.counters.length) out += '<div class="chips"><span class="mono">AI relics</span>' + m.counters.map(function (id) { return '<span class="chip" title="' + esc(G.COUNTERS[id].desc) + '">' + G.COUNTERS[id].name + '</span>'; }).join('') + '</div>';
    var p = [];
    if (m.perks && m.perks.strike) { var n = (3 - m.xTurns % 3) % 3; p.push('Double Strike: ' + (n === 0 ? 'this turn' : 'in ' + n)); }
    if (m.perks && m.perks.sleepy) { var k = 4 - (m.aiDue % 4); p.push('AI sleeps: ' + (k === 1 ? 'next turn' : 'in ' + k)); }
    if (p.length) out += '<div class="chips">' + p.map(function (t) { return '<span class="chip good">' + t + '</span>'; }).join('') + '</div>';
    return out;
  }

  function screenMatch5() {
    var m = run.match;
    return header(whereText(run)) + strip() + counterBar(m) + statusHtml(m) + board5(m) +
      (run.phase === 'result' ? resultHtml() : trayHtml(m));
  }

  /* ----- boss (Super XOX) ----- */
  function board9(m) {
    var S = m.S, myTurn = run.phase === 'match' && m.turn === 'X' && !m.over && !ui.thinking;
    var legal = {};
    if (myTurn) E.superMoves(S).forEach(function (mv) { legal[mv[0] * 9 + mv[1]] = 1; });
    var out = '<div class="board9' + (ui.boardTurn ? ' turn' : '') + '" role="group" aria-label="Super XOX board">';
    for (var b = 0; b < 9; b++) {
      var res = S.res[b], cls = 'sub';
      if (res === 1) cls += ' won wx'; else if (res === 2) cls += ' won wo'; else if (res === 3) cls += ' dead';
      else if (!m.over && (S.next < 0 || S.next === b)) cls += S.next < 0 ? ' free' : ' live';
      out += '<div class="' + cls + '" data-b="' + b + '">';
      if (S.cursed === b) out += '<span class="badge">CURSED</span>';
      for (var c = 0; c < 9; c++) {
        var bit = 1 << c, ccls = 'cell', inner = '';
        if (S.bx[b] & bit) { ccls += ' x'; inner = XM; } else if (S.bo[b] & bit) { ccls += ' o'; inner = OM; }
        if (legal[b * 9 + c]) ccls += ' legal';
        if (m.lastAI && m.lastAI.b === b && m.lastAI.c === c && !m.over) { ccls += ' last'; inner += '<i class="dot" style="top:3px;left:3px;width:6px;height:6px"></i>'; }
        if (m.hint && m.hint[0] === b && m.hint[1] === c) ccls += ' hint';
        var lab = 'Board ' + (b + 1) + ', square ' + (c + 1) + (S.bx[b] & bit ? ': your mark' : (S.bo[b] & bit ? ': boss mark' : ''));
        out += '<button class="' + ccls + '" data-act="cell9" data-b="' + b + '" data-c="' + c + '" aria-label="' + lab + '">' + inner + '</button>';
      }
      if (res === 1) out += '<span class="big">' + BIGX + '</span>'; else if (res === 2) out += '<span class="big">' + BIGO + '</span>'; else if (res === 3) out += '<span class="big">draw</span>';
      out += '</div>';
    }
    return out + '</div>';
  }
  function screenBoss() {
    var m = run.match, S = m.S, nx = 0, no = 0;
    for (var i = 0; i < 9; i++) { if (S.res[i] === 1) nx++; else if (S.res[i] === 2) no++; }
    return header(whereText(run)) + strip() +
      '<div class="boss-head"><h3>' + m.boss.name + '</h3><div class="score"><span>You <b style="color:var(--x)">' + nx + '</b></span><span>Boss <b style="color:var(--o)">' + no + '</b></span></div></div>' +
      '<p class="tag-line" style="margin-top:-8px">' + m.boss.blurb + '</p>' +
      statusHtml(m) + board9(m) + (run.phase === 'result' ? resultHtml() : trayHtml(m));
  }

  /* ----- shop, reward, end ----- */
  function screenShop() {
    var cards = run.shop.map(function (id) {
      var r = G.RELICS[id], p = G.priceOf(run, id), can = run.gold >= p;
      return '<div class="card static">' + ic(id) + '<span class="body"><h3>' + r.name + '</h3><p>' + r.desc + '</p></span><span class="foot"><span class="tag-line">' + useTag(id) + '</span>' +
        '<button class="btn sm primary" data-act="buy" data-id="' + id + '"' + (can ? '' : ' disabled') + '>Buy · ' + p + ' gold</button></span></div>';
    }).join('');
    var hp = G.healPrice(run), canHeal = run.hearts < run.maxHearts && run.gold >= hp;
    return header('Shop') + '<h2>Shop</h2>' +
      '<p>' + (run.shop.length ? 'Buy what you can afford. Unsold relics are gone when you leave.' : 'You bought everything on offer.') + '</p>' +
      '<div class="cards">' + cards + '</div>' +
      '<div class="card static" style="grid-template-columns:1fr"><span class="body"><h3>Heal a heart</h3><p>' + (run.hearts >= run.maxHearts ? 'Your hearts are full.' : 'Hearts: ' + run.hearts + ' of ' + run.maxHearts + '.') + '</p></span><span class="foot"><span></span><button class="btn sm" data-act="heal"' + (canHeal ? '' : ' disabled') + '>Heal · ' + hp + ' gold</button></span></div>' +
      (ui.msg ? '<p class="tag-line" aria-live="polite">' + esc(ui.msg) + '</p>' : '') +
      ownedRelics() +
      '<button class="btn primary block" data-act="leave">Leave the shop</button>';
  }
  function screenReward() {
    return header('Boss reward') + '<h2>Pick a relic</h2><p>Free, for beating the boss.</p>' +
      '<div class="cards">' + run.reward.map(function (id) { return relicCardBtn(id, 'reward', 'Take'); }).join('') + '</div>';
  }
  function screenEnd() {
    var won = run.over === 'won', s = run.stats;
    return '<h2>' + (won ? 'Run cleared' : 'Out of hearts') + '</h2>' +
      '<p>' + (won ? 'You beat all three bosses with ' + run.hearts + (run.hearts === 1 ? ' heart' : ' hearts') + ' left.' : 'You fell in ' + whereText(run).replace(' · ', ', ').toLowerCase() + '.') + '</p>' +
      '<div class="result' + (won ? '' : ' loss') + '"><dl class="sum">' +
      '<dt>Matches played</dt><dd>' + s.matches + '</dd><dt>Wins</dt><dd>' + s.wins + '</dd><dt>Draws</dt><dd>' + s.draws + '</dd><dt>Losses</dt><dd>' + s.losses + '</dd><dt>Bosses beaten</dt><dd>' + s.bossWins + ' of 3</dd><dt>Relics</dt><dd>' + run.relics.length + '</dd></dl></div>' +
      (run.relics.length ? '<p class="tag-line">' + run.relics.map(function (id) { return G.RELICS[id].name; }).join(' · ') + '</p>' : '') +
      '<div class="stack"><button class="btn primary block" data-act="new">Start a new run</button><button class="btn block" data-act="menu">Back to title</button></div>';
  }

  /* ---------- render ---------- */
  function render() {
    var html;
    if (!run) html = screenTitle();
    else switch (run.phase) {
      case 'starter': html = screenStarter(); break;
      case 'briefing': html = screenBriefing(); break;
      case 'match': case 'result': html = run.match ? (run.match.kind === '5' ? screenMatch5() : screenBoss()) : screenTitle(); break;
      case 'shop': html = screenShop(); break;
      case 'reward': html = screenReward(); break;
      case 'end': html = screenEnd(); break;
      default: html = screenTitle();
    }
    app.innerHTML = '<div class="shell">' + html + '</div>';
    var m = run && run.match;
    if (m && m.kind === '5') { ui.prevX = m.x; ui.prevO = m.o; } else { ui.prevX = 0; ui.prevO = 0; }
    if (m) m.rotatedNow = false;
    ui.boardTurn = false;
    var key = run ? run.phase + ':' + run.act + ':' + run.idx : 'title';
    if (key !== ui.screenKey) { ui.screenKey = key; try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }
  }

  /* ---------- flow ---------- */
  function finishRun() {
    if (run.recorded) return;
    run.recorded = true;
    var b = ui.best, prog = run.over === 'won' ? 12 : (run.act - 1) * 4 + run.idx + 1;
    b.runs++; if (prog > b.farthest) b.farthest = prog; if (run.over === 'won') b.victories++;
    lsSet(BEST, JSON.stringify(b));
    lsDel(SAVE); ui.saved = null;
  }
  function afterAction() {
    var m = run.match;
    if (m && m.flash) { ui.msg = (ui.msg ? ui.msg + ' ' : '') + m.flash; m.flash = ''; }
    if (run.phase === 'match' && m && m.over) G.resolve(run);
    if (run.phase === 'end') finishRun(); else save();
    var needAI = run.phase === 'match' && m && !m.over && m.turn === 'O';
    ui.thinking = !!needAI;
    if (m && m.kind === 'boss' && m.rotatedNow) ui.boardTurn = true;
    render();
    if (needAI) scheduleAI();
  }
  function scheduleAI() {
    var r = run, m = r.match;
    setTimeout(function () {
      if (run !== r || r.match !== m || !ui.thinking) return;
      var ev = m.kind === '5' ? G.ai5(m) : G.aiBoss(m);
      ui.msg = ev.join(' ');
      afterAction();
    }, 420);
  }
  function canAct() { return run && run.phase === 'match' && run.match && run.match.turn === 'X' && !run.match.over && !ui.thinking; }

  function onAct(a, d) {
    var m = run && run.match, msg;
    switch (a) {
      case 'new': run = G.startRun(); ui.msg = ''; ui.thinking = false; save(); render(); break;
      case 'continue':
        if (!ui.saved) return;
        run = ui.saved; ui.saved = null; ui.msg = ''; ui.thinking = false;
        ui.prevX = run.match && run.match.kind === '5' ? run.match.x : 0; ui.prevO = run.match && run.match.kind === '5' ? run.match.o : 0;
        afterAction(); break;
      case 'menu': if (run && run.phase !== 'end') save(); run = null; ui.thinking = false; ui.msg = ''; ui.saved = loadSaved(); render(); break;
      case 'starter': G.pickStarter(run, d.id); ui.msg = ''; save(); render(); break;
      case 'trick': G.chooseTrick(run, d.id); render(); break;
      case 'startmatch': ui.msg = ''; ui.prevX = 0; ui.prevO = 0; if (G.startMatch(run)) afterAction(); break;
      case 'cell':
        if (!canAct() || m.kind !== '5') return;
        ui.msg = G.tap5(m, +d.i) || ''; afterAction(); break;
      case 'cell9':
        if (!canAct() || m.kind !== 'boss') return;
        ui.msg = G.tapBoss(m, +d.b, +d.c) || ''; afterAction(); break;
      case 'relic':
        if (!m || run.phase !== 'match') return;
        var id = d.id, r = G.RELICS[id] || G.TRICKS[id];
        var isActive = G.RELICS[id] ? G.RELICS[id].kind === 'active' : (id === 'overplay' || id === 'freepass');
        if (!isActive) { ui.msg = r.name + ': ' + r.desc; render(); return; }
        if (!canAct()) return;
        ui.msg = (m.kind === '5' ? G.use5(m, id) : G.useBoss(m, id)) || ''; afterAction(); break;
      case 'next': G.next(run); ui.msg = ''; afterAction(); break;
      case 'buy': ui.msg = G.buy(run, d.id); save(); render(); break;
      case 'heal': ui.msg = G.heal(run); save(); render(); break;
      case 'leave': G.leaveShop(run); ui.msg = ''; afterAction(); break;
      case 'reward': G.pickReward(run, d.id); ui.msg = ''; afterAction(); break;
    }
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || !t.dataset.act || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
    onAct(t.dataset.act, t.dataset);
  });

  lsDel('xoxrogue.run.v1');
  ui.best = loadBest();
  ui.saved = loadSaved();
  render();
})();

</script>
</body>
</html>
