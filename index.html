<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>XOX Pop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10142A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XOX Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* One column: score, a 6x6 board of soft tiles, and a tray of three pieces. X is blue, O is pink. */
:root {
  --paper: #ECEFF4;
  --tile: #DDE3EE;
  --tile2: #D2DAE8;
  --ink: #161C38;
  --ink2: #5A6386;
  --x: #1D4FFF;
  --o: #E8247A;
  --x-soft: #C9D6FF;
  --o-soft: #FBD0E2;
  --hi: #FFC400;
  --card: #FFFFFF;
  --shadow: 0 10px 30px rgba(22, 28, 56, .14);
  /* board cell size: fits the width, and the height with the score and tray around it */
  --cell: min(calc((100vw - 32px - 5 * 6px - 16px) / 6), calc((100svh - 290px) / 8.6), 64px);
  --f: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10142A; --tile: #1C2246; --tile2: #242B57; --ink: #EEF0FF; --ink2: #9CA6D2;
    --x: #6C93FF; --o: #FF5C9F; --x-soft: #2E4196; --o-soft: #6B2659; --card: #1A2040;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10142A; --tile: #1C2246; --tile2: #242B57; --ink: #EEF0FF; --ink2: #9CA6D2;
  --x: #6C93FF; --o: #FF5C9F; --x-soft: #2E4196; --o-soft: #6B2659; --card: #1A2040;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f);
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }

.shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 20px max(16px, env(safe-area-inset-right, 0px));
}

/* top bar */
.top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.best { font-size: 13px; font-weight: 700; color: var(--ink2); letter-spacing: .04em; }
.best b { display: block; font-size: 18px; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.score { font-size: 48px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-align: center; }
.score.bump { animation: bump .25s ease-out; }
.tools { display: flex; gap: 6px; justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--tile); }
.icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.armed { color: var(--o); background: var(--o-soft); }

.status { height: 22px; font-size: 14px; font-weight: 800; color: var(--ink2); letter-spacing: .02em; text-align: center; }
.status .streak { color: var(--hi); }

/* board */
.board-wrap { position: relative; }
.board {
  display: grid; grid-template-columns: repeat(6, var(--cell)); gap: 6px; padding: 8px;
  background: var(--tile2); border-radius: 20px; touch-action: none;
}
.board.shake { animation: shake .35s ease-out; }
.cell { width: var(--cell); height: var(--cell); border-radius: 12px; background: var(--tile); position: relative; display: grid; place-items: center; }
.cell.x { background: var(--x-soft); }
.cell.o { background: var(--o-soft); }
.cell.ghost-x { background: var(--x-soft); }
.cell.ghost-o { background: var(--o-soft); }
.cell.ghost-x .mk, .cell.ghost-o .mk { opacity: .45; }
.cell.will-pop { animation: glow .6s ease-in-out infinite alternate; }
.cell.land .mk { animation: land .22s ease-out; }
.cell.pop { animation: pop .34s ease-in forwards; }

/* marks */
.mk { width: 62%; height: 62%; fill: none; stroke-width: 6.5; stroke-linecap: round; overflow: visible; }
.mk.x { stroke: var(--x); }
.mk.o { stroke: var(--o); }

/* tray */
.tray { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: calc(var(--cell) * 2.6 + 16px); touch-action: none; }
.slot { display: grid; place-items: center; border-radius: 18px; position: relative; }
.slot.selected { background: var(--tile); }
.piece { --pc: calc(var(--cell) * .62); display: grid; gap: 4px; transition: opacity .2s, transform .15s; }
.piece .pcell { width: var(--pc); height: var(--pc); border-radius: 8px; display: grid; place-items: center; }
.piece .pcell.x { background: var(--x-soft); }
.piece .pcell.o { background: var(--o-soft); }
.slot.nofit .piece { opacity: .3; }
.slot.dragging .piece { opacity: 0; }
.slot.fresh .piece { animation: deal .3s ease-out backwards; }
.slot:nth-child(2).fresh .piece { animation-delay: .05s; }
.slot:nth-child(3).fresh .piece { animation-delay: .1s; }

/* the piece under your finger, at full board size */
.float { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: grid; gap: 6px; filter: drop-shadow(0 10px 14px rgba(22, 28, 56, .22)); }
.float .pcell { width: var(--cell); height: var(--cell); border-radius: 12px; display: grid; place-items: center; }
.float .pcell.x { background: var(--x-soft); }
.float .pcell.o { background: var(--o-soft); }
.float.back { transition: transform .18s ease-in, opacity .18s; opacity: 0; }

/* effects layer */
.fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.spark { position: absolute; width: 9px; height: 9px; border-radius: 50%; margin: -4.5px 0 0 -4.5px; animation: spark .55s ease-out forwards; }
.gain { position: absolute; transform: translate(-50%, -50%); font-size: 26px; font-weight: 900; color: var(--ink); text-shadow: 0 2px 0 var(--paper); animation: rise .9s ease-out forwards; white-space: nowrap; }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 44px; font-weight: 900; color: var(--hi); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: banner .9s ease-out forwards; white-space: nowrap; }

/* game over */
.over { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(16, 20, 42, .45); animation: fade .25s ease-out; }
.over-card { width: min(100%, 340px); background: var(--card); border-radius: 26px; padding: 28px 22px 22px; text-align: center; box-shadow: var(--shadow); animation: deal .3s ease-out; }
.over-card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; color: var(--ink2); }
.over-card .big { font-size: 60px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
.over-card .newbest { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 99px; background: var(--hi); color: #161C38; font-weight: 900; font-size: 14px; letter-spacing: .04em; }
.over-card p { margin: 10px 0 0; color: var(--ink2); font-weight: 700; }
.play { margin-top: 22px; width: 100%; height: 58px; border-radius: 18px; background: var(--x); color: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 6px 0 rgba(0, 0, 0, .18); }
.play:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }

/* first run hint */
.hint { font-size: 15px; font-weight: 700; color: var(--ink2); text-align: center; max-width: 300px; line-height: 1.35; }
.hint .x { color: var(--x); } .hint .o { color: var(--o); }

@media (max-height: 620px) { .shell { gap: 12px; } .score { font-size: 40px; } .hint { font-size: 13px; } }

@keyframes bump { 50% { transform: scale(1.12); } }
@keyframes land { from { transform: scale(1.35); } to { transform: scale(1); } }
@keyframes pop { 40% { transform: scale(1.18); } to { transform: scale(.2) rotate(25deg); opacity: 0; } }
@keyframes glow { from { box-shadow: 0 0 0 0 var(--hi); } to { box-shadow: 0 0 0 4px var(--hi); } }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); } 75% { opacity: 1; transform: translate(-50%, -60%) scale(1) rotate(-4deg); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.95) rotate(-4deg); } }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }
@keyframes deal { from { transform: translateY(14px) scale(.85); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* XOX Pop rules: drop X and O pieces on a 6x6 board, three of a kind in a row pops. No DOM. */
var Game = (function () {
  'use strict';

  var N = 6, CELLS = N * N, EMPTY = 0, X = 1, O = 2;
  /* the game gets harder every `levelEvery` pieces: more mixed pieces and more big shapes */
  var cfg = { mixedBase: 0.1, mixedStep: 0.08, mixedMax: 0.9, bigStep: 2, levelEvery: 15, maxLevel: 15, diagonals: true, fairTries: 30 };

  /* seedable rng so tests and the simulator can replay a game */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* shapes as [row, col] offsets; weight = how often it shows up, big ones grow with the level */
  var SHAPES = [
    { cells: [[0, 0]], weight: 3 },
    { cells: [[0, 0], [0, 1]], weight: 4 },
    { cells: [[0, 0], [1, 0]], weight: 4 },
    { cells: [[0, 0], [0, 1], [0, 2]], weight: 2 },
    { cells: [[0, 0], [1, 0], [2, 0]], weight: 2 },
    { cells: [[0, 0], [1, 0], [1, 1]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 0]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 1]], weight: 1 },
    { cells: [[0, 1], [1, 0], [1, 1]], weight: 1 },
    { cells: [[0, 0], [0, 1], [1, 0], [1, 1]], weight: 0, big: 1 },
    { cells: [[0, 0], [0, 1], [0, 2], [0, 3]], weight: 0, big: 1 },
    { cells: [[0, 0], [1, 0], [2, 0], [3, 0]], weight: 0, big: 1 },
    { cells: [[0, 0], [0, 1], [0, 2], [1, 1]], weight: 0, big: 1 },
    { cells: [[0, 0], [1, 0], [2, 0], [2, 1]], weight: 0, big: 1 },
    { cells: [[0, 1], [0, 2], [1, 0], [1, 1]], weight: 0, big: 1 }
  ];
  function level(placed) { return Math.min(cfg.maxLevel, Math.floor(placed / cfg.levelEvery)); }

  /* a piece is a list of {r, c, m}; a single-mark piece gets one mark, a mixed one alternates */
  function randomPiece(rand, lv) {
    lv = lv || 0;
    var w = SHAPES.map(function (s) { return s.weight + (s.big ? s.big * cfg.bigStep * lv / 2 : 0); });
    var roll = rand() * w.reduce(function (a, b) { return a + b; }, 0), shape = SHAPES[0];
    for (var i = 0; i < SHAPES.length; i++) { roll -= w[i]; if (roll < 0) { shape = SHAPES[i]; break; } }
    var first = rand() < 0.5 ? X : O;
    var mixed = shape.cells.length > 1 && rand() < Math.min(cfg.mixedMax, cfg.mixedBase + cfg.mixedStep * lv);
    return shape.cells.map(function (rc, k) { return { r: rc[0], c: rc[1], m: mixed && k % 2 ? 3 - first : first }; });
  }

  function size(piece) {
    var h = 0, w = 0;
    piece.forEach(function (p) { h = Math.max(h, p.r + 1); w = Math.max(w, p.c + 1); });
    return { h: h, w: w };
  }

  function fits(board, piece, r, c) {
    for (var i = 0; i < piece.length; i++) {
      var rr = r + piece[i].r, cc = c + piece[i].c;
      if (rr < 0 || rr >= N || cc < 0 || cc >= N || board[rr * N + cc] !== EMPTY) return false;
    }
    return true;
  }
  function fitsAnywhere(board, piece) {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (fits(board, piece, r, c)) return true;
    return false;
  }

  /* every run of 3+ equal marks in a row, column or diagonal. Returns {cells: [...unique], lines: n} */
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  function findRuns(board) {
    var hit = {}, lines = 0;
    for (var d = 0; d < (cfg.diagonals ? 4 : 2); d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
        var m = board[r * N + c];
        if (m === EMPTY) continue;
        var pr = r - dr, pc = c - dc;
        if (pr >= 0 && pr < N && pc >= 0 && pc < N && board[pr * N + pc] === m) continue; /* not the start of a run */
        var len = 0, rr = r, cc = c;
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr * N + cc] === m) { len++; rr += dr; cc += dc; }
        if (len >= 3) {
          lines++;
          for (var k = 0; k < len; k++) hit[(r + k * dr) * N + c + k * dc] = 1;
        }
      }
    }
    return { cells: Object.keys(hit).map(Number), lines: lines };
  }

  /* new tray of three; at least one piece fits if any shape can */
  function newTray(board, rand, lv) {
    var tray;
    for (var t = 0; t < cfg.fairTries; t++) {
      tray = [randomPiece(rand, lv), randomPiece(rand, lv), randomPiece(rand, lv)];
      if (tray.some(function (p) { return fitsAnywhere(board, p); })) return tray;
    }
    tray[0] = [{ r: 0, c: 0, m: rand() < 0.5 ? X : O }];
    return tray;
  }

  function newGame(seed) {
    var s = seed === undefined ? (Math.random() * 4294967296) >>> 0 : seed >>> 0;
    var st = { v: 1, board: new Array(CELLS).fill(EMPTY), tray: [], score: 0, streak: 0, placed: 0, pops: 0, best: 0, over: false, seed: s, draws: 0 };
    st.tray = newTray(st.board, trayRand(st), 0);
    return st;
  }
  /* each tray draw gets its own seed so a saved game resumes on the same sequence */
  function trayRand(st) { return rng(st.seed + 0x9E3779B9 * ++st.draws); }

  function canPlay(st) {
    return st.tray.some(function (p) { return p && fitsAnywhere(st.board, p); });
  }

  /* places tray[i] with its top-left at (r, c). Returns null if it does not fit, else what happened. */
  function place(st, i, r, c) {
    var piece = st.tray[i];
    if (st.over || !piece || !fits(st.board, piece, r, c)) return null;
    var placedAt = piece.map(function (p) { var k = (r + p.r) * N + c + p.c; st.board[k] = p.m; return k; });
    var runs = findRuns(st.board);
    var gained = piece.length;
    if (runs.lines) {
      st.streak++;
      gained += runs.cells.length * 10 * runs.lines * Math.min(st.streak, 5);
      runs.cells.forEach(function (k) { st.board[k] = EMPTY; });
      st.pops += runs.lines;
    } else st.streak = 0;
    st.score += gained;
    st.placed++;
    st.tray[i] = null;
    var refilled = false;
    if (st.tray.every(function (p) { return !p; })) { st.tray = newTray(st.board, trayRand(st), level(st.placed)); refilled = true; }
    st.over = !canPlay(st);
    return { placed: placedAt, cleared: runs.cells, lines: runs.lines, streak: st.streak, gained: gained, refilled: refilled, over: st.over };
  }

  /* cells that would pop if tray[i] went at (r, c), for the drag preview */
  function preview(st, i, r, c) {
    var piece = st.tray[i];
    if (!piece || !fits(st.board, piece, r, c)) return null;
    var b = st.board.slice();
    piece.forEach(function (p) { b[(r + p.r) * N + c + p.c] = p.m; });
    return findRuns(b).cells;
  }

  return {
    N: N, CELLS: CELLS, EMPTY: EMPTY, X: X, O: O, cfg: cfg, SHAPES: SHAPES, level: level,
    rng: rng, randomPiece: randomPiece, size: size, fits: fits, fitsAnywhere: fitsAnywhere, findRuns: findRuns,
    newTray: newTray, newGame: newGame, canPlay: canPlay, place: place, preview: preview
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Game;

/* XOX Pop interface: drag (or tap) a piece onto the board. Needs Game. */
(function () {
  'use strict';
  var G = Game, N = G.N;
  var KEY = 'xoxpop.game.v1', BEST = 'xoxpop.best', SOUND = 'xoxpop.sound', SEEN = 'xoxpop.seen';
  var app = document.getElementById('app');
  var st = null, best = 0, soundOn = true, seen = false;
  var busy = false, sel = -1, press = null, drag = null, armed = 0, shown = 0, tween = 0;
  var els = {}, cellVal = [], ghosts = [];

  /* ---------- storage ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage may be unavailable */ } }
  function loadGame() {
    try {
      var s = JSON.parse(lsGet(KEY));
      if (s && s.v === 1 && !s.over && s.board && s.board.length === G.CELLS && s.tray && s.tray.length === 3) return s;
    } catch (e) { /* start fresh */ }
    return G.newGame();
  }
  function save() { lsSet(KEY, JSON.stringify(st)); }

  /* ---------- sound and touch feedback, all generated so it works offline ---------- */
  var ac = null;
  function audio() {
    if (!soundOn) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sfx = {
    pick: function () { tone(420, 0.05, 'sine', 0.08); },
    place: function () { tone(190, 0.08, 'triangle', 0.22, 0, 120); },
    pop: function (lines, streak) {
      var base = 520 * Math.pow(2, Math.min(streak - 1, 7) / 6), steps = [1, 1.26, 1.5, 2, 2.52];
      for (var k = 0; k < Math.min(lines, 5); k++) tone(base * steps[k], 0.2, 'triangle', 0.18, k * 0.07, base * steps[k] * 1.5);
    },
    over: function () { [392, 330, 262, 196].forEach(function (f, k) { tone(f, 0.22, 'triangle', 0.16, k * 0.14); }); }
  };
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not supported */ } }

  /* ---------- drawing ---------- */
  var ICON = {
    sound: '<path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
    mute: '<path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
    restart: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4.5H9"/>'
  };
  function svgIcon(id) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[id] + '</svg>'; }
  function mark(m) {
    return m === G.X ? '<svg class="mk x" viewBox="0 0 40 40" aria-hidden="true"><path d="M11 11L29 29M29 11L11 29"/></svg>'
      : '<svg class="mk o" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11"/></svg>';
  }
  function mc(m) { return m === G.X ? 'x' : 'o'; }
  function fmt(n) { return n.toLocaleString('en-US'); }
  function pieceHtml(piece, cls, unit) {
    var sz = G.size(piece);
    return '<div class="' + cls + '" style="grid-template-columns:repeat(' + sz.w + ',' + unit + ');grid-template-rows:repeat(' + sz.h + ',' + unit + ')">' +
      piece.map(function (p) { return '<div class="pcell ' + mc(p.m) + '" style="grid-area:' + (p.r + 1) + '/' + (p.c + 1) + '">' + mark(p.m) + '</div>'; }).join('') + '</div>';
  }

  function build() {
    app.innerHTML =
      '<main class="shell">' +
        '<div class="top">' +
          '<div class="best">BEST<b id="best">0</b></div>' +
          '<div class="score" id="score" aria-live="polite">0</div>' +
          '<div class="tools">' +
            '<button class="icon-btn" id="sound"></button>' +
            '<button class="icon-btn" id="restart" aria-label="Restart">' + svgIcon('restart') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="status" id="status"></div>' +
        '<div class="board-wrap" id="wrap"><div class="board" id="board" role="grid" aria-label="Board"></div><div class="fx" id="fx"></div></div>' +
        '<div class="tray" id="tray">' + [0, 1, 2].map(function (i) { return '<div class="slot" data-i="' + i + '"></div>'; }).join('') + '</div>' +
        '<p class="hint" id="hint">Drag a piece onto the board. Three <b class="x">X</b> or three <b class="o">O</b> in a line pop.</p>' +
      '</main>';
    ['best', 'score', 'sound', 'restart', 'status', 'wrap', 'board', 'fx', 'tray', 'hint'].forEach(function (id) { els[id] = document.getElementById(id); });
    els.slots = els.tray.children;
    var html = '';
    for (var i = 0; i < G.CELLS; i++) html += '<div class="cell" data-c="' + i + '"></div>';
    els.board.innerHTML = html;
    els.cells = els.board.children;
    cellVal = new Array(G.CELLS).fill(-1);

    els.tray.addEventListener('pointerdown', trayDown);
    els.tray.addEventListener('pointermove', trayMove);
    els.tray.addEventListener('pointerup', trayUp);
    els.tray.addEventListener('pointercancel', trayCancel);
    els.board.addEventListener('click', boardTap);
    els.sound.addEventListener('click', toggleSound);
    els.restart.addEventListener('click', restartTap);
  }

  function drawCell(i, m, extra) {
    var el = els.cells[i];
    el.className = 'cell' + (m ? ' ' + mc(m) : '') + (extra ? ' ' + extra : '');
    if (cellVal[i] !== m) { el.innerHTML = m ? mark(m) : ''; cellVal[i] = m; }
  }
  function renderBoard() { for (var i = 0; i < G.CELLS; i++) drawCell(i, st.board[i]); }
  function renderTray(fresh) {
    for (var i = 0; i < 3; i++) {
      var p = st.tray[i], slot = els.slots[i];
      slot.className = 'slot' + (p && !G.fitsAnywhere(st.board, p) ? ' nofit' : '') + (i === sel ? ' selected' : '') + (fresh && p ? ' fresh' : '');
      slot.innerHTML = p ? pieceHtml(p, 'piece', 'var(--pc)') : '';
      slot.setAttribute('aria-label', p ? 'Piece of ' + p.length : 'Empty');
    }
  }
  function renderStatus() {
    var lv = G.level(st.placed);
    els.status.innerHTML = armed ? 'Tap again to restart'
      : st.streak >= 2 ? '<span class="streak">Streak ×' + st.streak + '</span>'
      : lv ? 'Level ' + (lv + 1) : '';
  }
  function renderBest() { els.best.textContent = fmt(Math.max(best, st.score)); }
  function renderScore(animate) {
    cancelAnimationFrame(tween);
    var target = st.score;
    if (!animate) { shown = target; els.score.textContent = fmt(target); return; }
    var from = shown, t0 = performance.now();
    (function step(t) {
      var k = Math.min(1, (t - t0) / 450);
      shown = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
      els.score.textContent = fmt(shown);
      if (k < 1) tween = requestAnimationFrame(step);
    })(t0);
  }
  function renderSound() {
    els.sound.innerHTML = svgIcon(soundOn ? 'sound' : 'mute');
    els.sound.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
  }
  function renderAll() { renderBoard(); renderTray(true); renderStatus(); renderBest(); renderScore(false); renderSound(); els.hint.hidden = seen; }

  /* ---------- geometry ---------- */
  function geo() {
    var a = els.cells[0].getBoundingClientRect(), b = els.cells[1].getBoundingClientRect();
    return { left: a.left, top: a.top, size: a.width, pitch: b.left - a.left };
  }
  function cellCenter(i) {
    var r = els.cells[i].getBoundingClientRect(), w = els.wrap.getBoundingClientRect();
    return { x: r.left - w.left + r.width / 2, y: r.top - w.top + r.height / 2 };
  }

  /* ---------- ghost preview ---------- */
  function clearGhost() {
    ghosts.forEach(function (i) { drawCell(i, st.board[i]); });
    ghosts = [];
  }
  function showGhost(i, r, c) {
    clearGhost();
    var piece = st.tray[i], pops = G.preview(st, i, r, c);
    if (!pops) return;
    piece.forEach(function (p) { var k = (r + p.r) * N + c + p.c; drawCell(k, p.m, 'ghost-' + mc(p.m)); ghosts.push(k); });
    pops.forEach(function (k) { els.cells[k].classList.add('will-pop'); if (ghosts.indexOf(k) < 0) ghosts.push(k); });
  }

  /* ---------- tray input: drag, or tap to select then tap the board ---------- */
  function trayDown(e) {
    if (busy || st.over || drag) return;
    var slot = e.target.closest('.slot'); if (!slot) return;
    var i = +slot.dataset.i; if (!st.tray[i]) return;
    press = { i: i, x: e.clientX, y: e.clientY, id: e.pointerId };
    try { els.tray.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    audio();
  }
  function trayMove(e) {
    if (!press || e.pointerId !== press.id) return;
    if (!drag) {
      if (Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) < 8) return;
      startDrag(press.i);
    }
    moveDrag(e.clientX, e.clientY);
  }
  function trayUp(e) {
    if (!press || e.pointerId !== press.id) return;
    var i = press.i; press = null;
    if (drag) { endDrag(); return; }
    sel = sel === i ? -1 : i; sfx.pick(); renderTray(false);
  }
  function trayCancel() { press = null; if (drag) { drag.target = null; endDrag(); } }

  function startDrag(i) {
    sel = -1; renderTray(false);
    var g = geo(), piece = st.tray[i], sz = G.size(piece);
    var el = document.createElement('div');
    el.innerHTML = pieceHtml(piece, 'float', 'var(--cell)');
    el = el.firstChild;
    document.body.appendChild(el);
    drag = { i: i, el: el, g: g, w: sz.w * g.pitch - (g.pitch - g.size), h: sz.h * g.pitch - (g.pitch - g.size), target: null };
    els.slots[i].classList.add('dragging');
    sfx.pick(); buzz(5);
  }
  function moveDrag(x, y) {
    var d = drag, g = d.g;
    var fx = x - d.w / 2, fy = y - d.h - g.size * 0.75; /* lift the piece above the finger */
    d.el.style.transform = 'translate(' + fx + 'px,' + fy + 'px)';
    var r = Math.round((fy - g.top) / g.pitch), c = Math.round((fx - g.left) / g.pitch);
    var ok = G.fits(st.board, st.tray[d.i], r, c);
    var key = ok ? r + ',' + c : null;
    if (key === (d.target && d.target.key)) return;
    d.target = ok ? { r: r, c: c, key: key } : null;
    if (ok) showGhost(d.i, r, c); else clearGhost();
  }
  function endDrag() {
    var d = drag; drag = null;
    clearGhost();
    if (d.target) { d.el.remove(); place(d.i, d.target.r, d.target.c); return; }
    /* fly back to the tray */
    var s = els.slots[d.i].getBoundingClientRect();
    d.el.classList.add('back');
    d.el.style.transform = 'translate(' + (s.left + s.width / 2 - d.w / 2) + 'px,' + (s.top + s.height / 2 - d.h / 2) + 'px) scale(.62)';
    setTimeout(function () { d.el.remove(); els.slots[d.i].classList.remove('dragging'); }, 190);
  }

  /* tapping the board with a piece selected: put it where it fits, centred on the tap if it can */
  function boardTap(e) {
    if (sel < 0 || busy || st.over) return;
    var cell = e.target.closest('.cell'); if (!cell) return;
    var k = +cell.dataset.c, tr = Math.floor(k / N), tc = k % N, piece = st.tray[sel], sz = G.size(piece);
    var tries = [[tr - Math.floor((sz.h - 1) / 2), tc - Math.floor((sz.w - 1) / 2)]];
    piece.forEach(function (p) { tries.push([tr - p.r, tc - p.c]); });
    for (var t = 0; t < tries.length; t++) {
      if (G.fits(st.board, piece, tries[t][0], tries[t][1])) { var i = sel; sel = -1; place(i, tries[t][0], tries[t][1]); return; }
    }
    buzz(15);
  }

  /* ---------- placing and popping ---------- */
  function place(i, r, c) {
    var piece = st.tray[i], before = st.board.slice();
    piece.forEach(function (p) { before[(r + p.r) * N + c + p.c] = p.m; });
    var res = G.place(st, i, r, c);
    if (!res) return;
    disarm();
    res.placed.forEach(function (k) { drawCell(k, before[k], 'land'); });
    sfx.place(); buzz(8);
    if (res.lines) {
      busy = true;
      res.cleared.forEach(function (k) { drawCell(k, before[k], 'pop'); });
      setTimeout(function () { busy = false; renderBoard(); }, 340);
      effects(res, before);
      if (!seen) { seen = true; lsSet(SEEN, '1'); els.hint.hidden = true; }
    }
    renderTray(res.refilled);
    renderStatus(); renderBest(); renderScore(true);
    if (res.gained >= 100) { els.score.classList.remove('bump'); void els.score.offsetWidth; els.score.classList.add('bump'); }
    if (st.score > best) { best = st.score; lsSet(BEST, String(best)); }
    save();
    if (res.over) setTimeout(gameOver, res.lines ? 800 : 500);
  }

  function effects(res, before) {
    var fx = els.fx, sx = 0, sy = 0;
    res.cleared.forEach(function (k) {
      var p = cellCenter(k); sx += p.x; sy += p.y;
      for (var n = 0; n < 5; n++) {
        var s = document.createElement('i'), a = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 40;
        s.className = 'spark';
        s.style.cssText = 'left:' + p.x + 'px;top:' + p.y + 'px;background:var(--' + mc(before[k]) + ');--dx:' + Math.cos(a) * dist + 'px;--dy:' + Math.sin(a) * dist + 'px';
        fx.appendChild(s);
        setTimeout(s.remove.bind(s), 600);
      }
    });
    var gain = document.createElement('div');
    gain.className = 'gain';
    gain.textContent = '+' + fmt(res.gained);
    gain.style.left = sx / res.cleared.length + 'px'; gain.style.top = sy / res.cleared.length + 'px';
    fx.appendChild(gain); setTimeout(gain.remove.bind(gain), 950);
    var word = res.lines >= 4 ? 'Mega!' : res.lines === 3 ? 'Triple!' : res.lines === 2 ? 'Double!' : res.streak >= 3 ? 'On fire!' : res.streak === 2 ? 'Nice!' : '';
    if (word) {
      var b = document.createElement('div');
      b.className = 'banner'; b.textContent = word;
      fx.appendChild(b); setTimeout(b.remove.bind(b), 950);
    }
    if (res.lines >= 2) { els.board.classList.remove('shake'); void els.board.offsetWidth; els.board.classList.add('shake'); }
    sfx.pop(res.lines, res.streak);
    buzz(res.lines >= 2 ? [20, 40, 30] : 20);
  }

  function gameOver() {
    sfx.over(); buzz([30, 60, 30]);
    var isBest = st.score > 0 && st.score >= best;
    var ov = document.createElement('div');
    ov.className = 'over';
    ov.innerHTML = '<div class="over-card" role="dialog" aria-label="Game over">' +
      '<h2>No more room</h2>' +
      '<div class="big">' + fmt(st.score) + '</div>' +
      (isBest ? '<span class="newbest">NEW BEST</span>' : '<p>Best ' + fmt(best) + '</p>') +
      '<p>' + st.placed + ' pieces · ' + st.pops + ' pops</p>' +
      '<button class="play" id="again">Play again</button></div>';
    document.body.appendChild(ov);
    var btn = document.getElementById('again');
    btn.addEventListener('click', function () { ov.remove(); newGame(); });
  }

  function newGame() {
    disarm(); st = G.newGame(); sel = -1; save(); renderAll();
  }
  /* restart needs two taps so a stray thumb does not wipe a good game */
  function disarm() { if (armed) { clearTimeout(armed); armed = 0; els.restart.classList.remove('armed'); } }
  function restartTap() {
    if (st.placed === 0 || st.over) { newGame(); return; }
    if (armed) { newGame(); return; }
    armed = setTimeout(function () { disarm(); renderStatus(); }, 2500);
    els.restart.classList.add('armed'); renderStatus();
  }
  function toggleSound() {
    soundOn = !soundOn; lsSet(SOUND, soundOn ? '1' : '0'); renderSound();
    if (soundOn) sfx.pick();
  }

  /* ---------- start ---------- */
  best = +lsGet(BEST) || 0;
  soundOn = lsGet(SOUND) !== '0';
  seen = lsGet(SEEN) === '1';
  st = loadGame(); save();
  build();
  renderAll();
  /* offline after the first visit when served over http(s) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* not available here */ }); });
  }
})();

</script>
</body>
</html>
